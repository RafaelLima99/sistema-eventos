# Ambiente de DESENVOLVIMENTO.
#   docker compose up -d
#   docker compose exec app php artisan ...
#
# Variáveis (DB_*, APP_PORT etc.) vêm do .env do projeto.
# Overrides pessoais: compose.override.yaml (ignorado pelo git).
# O scheduler não sobe aqui: use `docker compose exec app php artisan schedule:work`.

name: sistema-eventos

x-app: &app
  build:
    context: .
    dockerfile: docker/php/Dockerfile
    target: dev
  image: sistema-eventos-app:dev
  user: "${DOCKER_UID:-1000}:${DOCKER_GID:-1000}"
  working_dir: /var/www/html
  volumes:
    - .:/var/www/html
  extra_hosts:
    - host.docker.internal:host-gateway
  environment:
    XDEBUG_MODE: ${XDEBUG_MODE:-off}
  depends_on:
    db:
      condition: service_healthy

services:
  app:
    <<: *app

  web:
    image: nginxinc/nginx-unprivileged:alpine
    ports:
      - "${APP_PORT:-8000}:8080"
    volumes:
      - ./public:/var/www/html/public:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

  queue:
    <<: *app
    command: php artisan queue:listen --tries=1 --timeout=0
    depends_on:
      - app

  db:
    image: mysql:8.4
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    ports:
      - "127.0.0.1:${DB_FORWARD_PORT:-3306}:3306"
    volumes:
      - dbdata:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s

  mailpit:
    image: axllent/mailpit:v1.21
    ports:
      - "${MAILPIT_PORT:-8025}:8025"

volumes:
  dbdata:
