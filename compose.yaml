# Ambiente de DESENVOLVIMENTO.
#   docker compose up -d
#   docker compose exec app php artisan ...
#
# Variáveis (DB_*, APP_PORT etc.) vêm do .env do projeto.
# Overrides pessoais: compose.override.yaml (ignorado pelo git).
# A fila (queue) e o agendador (scheduler) sobem juntos, igual à produção.

name: sistema-eventos

x-app: &app
  build:
    context: .
    dockerfile: docker/php/Dockerfile
    target: dev
  image: sistema-eventos-app:dev
  user: "${DOCKER_UID:-1000}:${DOCKER_GID:-1000}"
  working_dir: /var/www/html
  volumes:
    - .:/var/www/html
  extra_hosts:
    - host.docker.internal:host-gateway
  environment:
    XDEBUG_MODE: ${XDEBUG_MODE:-off}
  depends_on:
    db:
      condition: service_healthy

services:
  app:
    <<: *app

  web:
    image: nginxinc/nginx-unprivileged:alpine
    ports:
      - "${APP_PORT:-8000}:8080"
    volumes:
      - ./public:/var/www/html/public:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

  # Fila: processa os jobs em segundo plano (ex.: envio dos e-mails das automações).
  # Sobe sozinho com `docker compose up -d`; não precisa rodar queue:work à mão.
  # Usa a mesma imagem do app (<<: *app), então não ocupa disco a mais: só muda o comando.
  # O custo é um processo PHP a mais (~70 MB de memória).
  # queue:listen abre um processo novo a cada ciclo: pega as mudanças no código sem reiniciar
  # (bom para desenvolvimento). Em produção usa-se queue:work (ver compose.prod.yaml).
  # Atenção: o .env é lido só quando a fila sobe. Mudou o .env? Rode: docker compose restart queue
  # O --tries=1 vale só para jobs que não definem $tries (o EnviarEmailDaAutomacao define 3).
  # Ver os jobs rodando: docker compose logs -f queue
  queue:
    <<: *app
    command: php artisan queue:listen --tries=1 --timeout=0
    depends_on:
      - app

  # Agendador: a cada minuto roda as tarefas de routes/console.php (ex.: e-mails agendados das automações).
  # Sobe sozinho com `docker compose up -d`, igual à produção; não precisa rodar schedule:work à mão.
  # Usa a mesma imagem do app (<<: *app): só muda o comando.
  # Cada rodada lê o código atualizado, mas o .env só é lido quando o container sobe.
  # Mudou o .env? Rode: docker compose restart scheduler
  # Ver o que está rodando: docker compose logs -f scheduler
  scheduler:
    <<: *app
    command: php artisan schedule:work
    depends_on:
      - app

  db:
    image: mysql:8.4
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    ports:
      - "127.0.0.1:${DB_FORWARD_PORT:-3306}:3306"
    volumes:
      - dbdata:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s

volumes:
  dbdata:
