# Ambiente de PRODUÇÃO — núcleo portável (sem proxy, sem portas publicadas).
#
# Funciona com `docker compose` puro ou em qualquer painel que aceite Compose (Coolify, Dokploy, Portainer...).
# O proxy/HTTPS fica por conta do painel (Coolify). Detalhes no DEPLOY.md.
# Todas as variáveis estão documentadas em .env.production.example.
#
#   docker compose -f compose.prod.yaml build
#   docker compose -f compose.prod.yaml up -d
#
# Para usar um banco externo/gerenciado, remova o serviço `db` e ajuste DB_HOST.

name: sistema-eventos

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

# Base comum de app, queue e scheduler: mesma imagem, mesmas variáveis.
x-app: &app
  image: sistema-eventos-app:prod
  build:
    context: .
    dockerfile: docker/php/Dockerfile
    target: prod
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true
  logging: *logging
  volumes:
    - storage:/var/www/html/storage
  depends_on:
    db:
      condition: service_healthy
  environment:
    APP_NAME: ${APP_NAME:-Sistema Eventos}
    APP_ENV: production
    APP_KEY: ${APP_KEY:?defina APP_KEY}
    APP_DEBUG: "false"
    APP_URL: ${APP_URL:?defina APP_URL}
    APP_LOCALE: ${APP_LOCALE:-pt_BR}
    APP_FALLBACK_LOCALE: ${APP_FALLBACK_LOCALE:-en}
    LOG_CHANNEL: stderr
    LOG_LEVEL: ${LOG_LEVEL:-warning}
    DB_CONNECTION: mysql
    DB_HOST: ${DB_HOST:-db}
    DB_PORT: ${DB_PORT:-3306}
    DB_DATABASE: ${DB_DATABASE:-sistema_eventos}
    DB_USERNAME: ${DB_USERNAME:-sistema}
    DB_PASSWORD: ${DB_PASSWORD:?defina DB_PASSWORD}
    CACHE_STORE: database
    SESSION_DRIVER: database
    QUEUE_CONNECTION: database
    MAIL_MAILER: ${MAIL_MAILER:-smtp}
    MAIL_HOST: ${MAIL_HOST:-}
    MAIL_PORT: ${MAIL_PORT:-587}
    MAIL_USERNAME: ${MAIL_USERNAME:-}
    MAIL_PASSWORD: ${MAIL_PASSWORD:-}
    MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-}
    MAIL_FROM_NAME: ${MAIL_FROM_NAME:-Sistema Eventos}
    FILESYSTEM_DISK: ${FILESYSTEM_DISK:-local}
    # Só o serviço `app` aplica migrations (ver entrypoint.sh).
    RUN_MIGRATIONS: ${RUN_MIGRATIONS:-false}

services:
  app:
    <<: *app

  web:
    image: sistema-eventos-web:prod
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      target: web
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    logging: *logging
    expose:
      - "8080"
    volumes:
      - storage:/var/www/html/storage:ro
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/nginx-health"]
      interval: 30s
      timeout: 3s
      retries: 3

  queue:
    <<: *app
    depends_on:
      app:
        condition: service_healthy
    command: php artisan queue:work --sleep=3 --tries=3 --max-time=3600
    stop_grace_period: 60s
    healthcheck:
      disable: true

  scheduler:
    <<: *app
    depends_on:
      app:
        condition: service_healthy
    command: php artisan schedule:work
    healthcheck:
      disable: true

  db:
    image: mysql:8.4
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    logging: *logging
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-sistema_eventos}
      MYSQL_USER: ${DB_USERNAME:-sistema}
      MYSQL_PASSWORD: ${DB_PASSWORD:?defina DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?defina DB_ROOT_PASSWORD}
    volumes:
      - dbdata:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 3s
      retries: 20
      start_period: 30s

volumes:
  storage:
  dbdata:
